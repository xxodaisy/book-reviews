<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moon's Book Reviews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-top">
      <div class="profile-row">
        <div class="avatar">
          <img src="https://i.pinimg.com/736x/43/bd/81/43bd816846e900687b08d6932244c6c4.jpg" alt="Ciaa" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
      </div>
        <div class="profile-text">
          <div class="site-title">Moon's Book Reviews🌙</div>
          <div class="site-bio">
            Hi, my name is Ciaa (she/her). I'm a book lover who loves getting lost in both fiction and non-fiction.
            This is my little corner to keep track of everything I've read. Happy browsing!
          </div>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <div class="tab-row">
      <button class="tab active" data-tab="all">Semua</button>
      <button class="tab" data-tab="fiction">Fiction</button>
      <button class="tab" data-tab="nonfiction">Non-Fiction</button>
      <button class="tab" data-tab="tbr">TBR</button>
    </div>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari judul atau penulis..." />
    </div>
  </div>

  <!-- COUNT -->
  <div class="count-label" id="countLabel"></div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <script src="books.js"></script>
  <script src="app.js"></script>
</body>
</html>
